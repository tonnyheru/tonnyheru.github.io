<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#0a0e1a">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1530"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2d6e"/>
      <stop offset="100%" style="stop-color:#0f1a4a"/>
    </linearGradient>
    <linearGradient id="wallLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#162050"/>
      <stop offset="100%" style="stop-color:#1a2860"/>
    </linearGradient>
    <linearGradient id="wallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1535"/>
      <stop offset="100%" style="stop-color:#111d4a"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00aaff;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1b40"/>
      <stop offset="100%" style="stop-color:#080e20"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="60" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="200" cy="20" r="1" fill="#00d4ff" opacity="0.7"/>
  <circle cx="310" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="600" cy="25" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="700" cy="50" r="1" fill="#00ffcc" opacity="0.6"/>
  <circle cx="750" cy="15" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="680" cy="80" r="1.5" fill="#ffffff" opacity="0.3"/>

  <!-- Grid floor -->
  <g opacity="0.15">
    <line x1="0" y1="400" x2="800" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="0" y1="440" x2="800" y2="440" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="0" y1="460" x2="800" y2="460" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="100" y1="380" x2="100" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="200" y1="380" x2="200" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="300" y1="380" x2="300" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="400" y1="380" x2="400" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="500" y1="380" x2="500" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="600" y1="380" x2="600" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="700" y1="380" x2="700" y2="500" stroke="#00d4ff" stroke-width="0.3"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="310" cy="410" rx="200" ry="25" fill="#00d4ff" opacity="0.05"/>

  <!-- ===== HOUSE ISOMETRIC ===== -->
  <!-- Ground/base -->
  <polygon points="120,395 310,415 500,395 310,375" fill="url(#groundGrad)" stroke="#1e3a7a" stroke-width="1"/>

  <!-- Left Wall -->
  <polygon points="120,240 120,395 310,415 310,260" fill="url(#wallLeft)" stroke="#1e3a7a" stroke-width="1"/>

  <!-- Right Wall -->
  <polygon points="310,260 310,415 500,395 500,240" fill="url(#wallRight)" stroke="#1e3a7a" stroke-width="1"/>

  <!-- Roof Left face -->
  <polygon points="120,240 215,160 310,205 310,260" fill="url(#roofGrad)" stroke="#2a3f8f" stroke-width="1"/>

  <!-- Roof Right face -->
  <polygon points="310,205 405,160 500,240 310,260" fill="#0d1535" stroke="#2a3f8f" stroke-width="1"/>

  <!-- Roof Ridge glow -->
  <line x1="215" y1="160" x2="405" y2="160" stroke="#00d4ff" stroke-width="2" filter="url(#glow)" opacity="0.8"/>

  <!-- === LEFT WALL DETAILS === -->

  <!-- Window 1 left wall -->
  <polygon points="145,280 145,340 220,350 220,290" fill="#0d2a5e" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
  <polygon points="145,280 145,340 220,350 220,290" fill="rgba(0,212,255,0.08)"/>
  <!-- Window glow lines -->
  <line x1="145" y1="280" x2="220" y2="290" stroke="#00d4ff" stroke-width="1" opacity="0.7" filter="url(#softGlow)"/>
  <line x1="145" y1="340" x2="220" y2="350" stroke="#00d4ff" stroke-width="1" opacity="0.7" filter="url(#softGlow)"/>
  <!-- Window cross -->
  <line x1="182" y1="280" x2="184" y2="350" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>
  <line x1="145" y1="310" x2="220" y2="320" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>
  <!-- Window interior glow -->
  <polygon points="147,282 147,338 218,348 218,292" fill="rgba(0,212,255,0.05)"/>

  <!-- Window 2 smaller -->
  <polygon points="240,275 240,320 295,328 295,283" fill="#0d2a5e" stroke="#00ffcc" stroke-width="1" opacity="0.8"/>
  <line x1="267" y1="275" x2="268" y2="328" stroke="#00ffcc" stroke-width="0.5" opacity="0.5"/>
  <line x1="240" y1="297" x2="295" y2="305" stroke="#00ffcc" stroke-width="0.5" opacity="0.5"/>

  <!-- Door left wall -->
  <polygon points="155,350 155,395 210,402 210,357" fill="#0a1f50" stroke="#00d4ff" stroke-width="1"/>
  <polygon points="157,352 157,393 208,400 208,359" fill="rgba(0,100,255,0.1)"/>
  <!-- Door handle -->
  <circle cx="200" cy="378" r="3" fill="#00d4ff" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Neon edge lines left wall -->
  <line x1="120" y1="240" x2="120" y2="395" stroke="#00d4ff" stroke-width="1.5" opacity="0.6" filter="url(#softGlow)"/>
  <line x1="120" y1="395" x2="310" y2="415" stroke="#00d4ff" stroke-width="1.5" opacity="0.5" filter="url(#softGlow)"/>

  <!-- === RIGHT WALL DETAILS === -->

  <!-- Window right wall -->
  <polygon points="340,270 340,330 450,320 450,260" fill="#081530" stroke="#7b2fff" stroke-width="1" opacity="0.9"/>
  <line x1="395" y1="260" x2="395" y2="330" stroke="#7b2fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="340" y1="295" x2="450" y2="290" stroke="#7b2fff" stroke-width="0.5" opacity="0.5"/>

  <!-- Smart panel on right wall -->
  <polygon points="355,345 355,390 420,383 420,338" fill="#0a1520" stroke="#00ffcc" stroke-width="1"/>
  <text x="372" y="358" font-size="5" fill="#00ffcc" opacity="0.8">◉ SMART HUB</text>
  <rect x="360" y="363" width="30" height="3" rx="1" fill="#00ffcc" opacity="0.4"/>
  <rect x="360" y="370" width="20" height="2" rx="1" fill="#00d4ff" opacity="0.4"/>
  <rect x="360" y="376" width="25" height="2" rx="1" fill="#7b2fff" opacity="0.4"/>
  <circle cx="405" cy="367" r="5" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.7"/>
  <circle cx="405" cy="367" r="2" fill="#00ffcc" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Neon edge lines right wall -->
  <line x1="500" y1="240" x2="500" y2="395" stroke="#7b2fff" stroke-width="1.5" opacity="0.6" filter="url(#softGlow)"/>
  <line x1="310" y1="415" x2="500" y2="395" stroke="#7b2fff" stroke-width="1.5" opacity="0.5" filter="url(#softGlow)"/>

  <!-- === ROOF DECORATIONS === -->
  <!-- Solar panels on roof -->
  <polygon points="135,232 175,200 220,215 180,247" fill="#0a1f60" stroke="#00d4ff" stroke-width="0.8" opacity="0.9"/>
  <line x1="135" y1="232" x2="220" y2="215" stroke="#00d4ff" stroke-width="0.4" opacity="0.4"/>
  <line x1="175" y1="200" x2="180" y2="247" stroke="#00d4ff" stroke-width="0.4" opacity="0.4"/>
  <line x1="155" y1="216" x2="200" y2="231" stroke="#00d4ff" stroke-width="0.4" opacity="0.3"/>

  <!-- Antenna -->
  <line x1="310" y1="160" x2="310" y2="120" stroke="#00d4ff" stroke-width="1.5" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="310" cy="118" r="4" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.9" filter="url(#glow)"/>
  <circle cx="310" cy="118" r="2" fill="#00d4ff" opacity="1" filter="url(#glow)"/>
  <!-- Signal waves -->
  <path d="M295,130 Q310,118 325,130" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <path d="M285,138 Q310,118 335,138" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
  <path d="M275,146 Q310,118 345,146" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.25"/>

  <!-- ===== IOT FLOATING PANELS ===== -->

  <!-- Panel 1 - Temperature & Energy (left side) -->
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="150" height="130" rx="12" fill="url(#panelGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
    <rect x="0" y="0" width="150" height="130" rx="12" fill="rgba(0,212,255,0.03)"/>
    <!-- Header -->
    <text x="12" y="20" font-size="7" fill="#00d4ff" font-family="monospace" font-weight="bold" opacity="0.9">⚡ ENERGY MONITOR</text>
    <line x1="8" y1="25" x2="142" y2="25" stroke="#00d4ff" stroke-width="0.5" opacity="0.4"/>
    <!-- Temperature -->
    <text x="12" y="42" font-size="6" fill="#888" font-family="monospace">TEMPERATURE</text>
    <text x="12" y="58" font-size="18" fill="#00ffcc" font-family="monospace" font-weight="bold" filter="url(#softGlow)">24°C</text>
    <!-- Bar chart -->
    <text x="12" y="78" font-size="6" fill="#888" font-family="monospace">ENERGY USAGE (kWh)</text>
    <rect x="12" y="84" width="18" height="20" rx="2" fill="#00d4ff" opacity="0.7"/>
    <rect x="34" y="90" width="18" height="14" rx="2" fill="#00d4ff" opacity="0.6"/>
    <rect x="56" y="82" width="18" height="22" rx="2" fill="#00ffcc" opacity="0.8"/>
    <rect x="78" y="88" width="18" height="16" rx="2" fill="#00d4ff" opacity="0.6"/>
    <rect x="100" y="86" width="18" height="18" rx="2" fill="#7b2fff" opacity="0.7"/>
    <rect x="122" y="85" width="18" height="19" rx="2" fill="#00d4ff" opacity="0.5"/>
    <!-- Status -->
    <circle cx="16" cy="120" r="4" fill="#22c55e" opacity="0.9" filter="url(#softGlow)"/>
    <text x="26" y="123" font-size="6" fill="#22c55e" font-family="monospace">ALL SYSTEMS NORMAL</text>
  </g>
  <!-- Panel 1 connection line to house -->
  <line x1="170" y1="165" x2="200" y2="290" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.35"/>
  <circle cx="170" cy="165" r="3" fill="#00d4ff" opacity="0.7" filter="url(#softGlow)"/>

  <!-- Panel 2 - Device Status (top right floating) -->
  <g transform="translate(590, 80)">
    <rect x="0" y="0" width="170" height="140" rx="12" fill="url(#panelGrad)" stroke="#7b2fff" stroke-width="1" opacity="0.9"/>
    <rect x="0" y="0" width="170" height="140" rx="12" fill="rgba(123,47,255,0.03)"/>
    <!-- Header -->
    <text x="12" y="20" font-size="7" fill="#7b2fff" font-family="monospace" font-weight="bold" opacity="0.9">🏠 DEVICE STATUS</text>
    <line x1="8" y1="25" x2="162" y2="25" stroke="#7b2fff" stroke-width="0.5" opacity="0.4"/>
    <!-- Devices list -->
    <circle cx="20" cy="42" r="4" fill="#22c55e" opacity="0.9" filter="url(#softGlow)"/>
    <text x="30" y="46" font-size="7" fill="#ccc" font-family="monospace">Smart Lighting</text>
    <text x="140" y="46" font-size="7" fill="#22c55e" font-family="monospace">ON</text>

    <circle cx="20" cy="62" r="4" fill="#22c55e" opacity="0.9" filter="url(#softGlow)"/>
    <text x="30" y="66" font-size="7" fill="#ccc" font-family="monospace">Security Cam</text>
    <text x="140" y="66" font-size="7" fill="#22c55e" font-family="monospace">ON</text>

    <circle cx="20" cy="82" r="4" fill="#f59e0b" opacity="0.9" filter="url(#softGlow)"/>
    <text x="30" y="86" font-size="7" fill="#ccc" font-family="monospace">Smart Lock</text>
    <text x="130" y="86" font-size="7" fill="#f59e0b" font-family="monospace">LOCK</text>

    <circle cx="20" cy="102" r="4" fill="#22c55e" opacity="0.9" filter="url(#softGlow)"/>
    <text x="30" y="106" font-size="7" fill="#ccc" font-family="monospace">Thermostat</text>
    <text x="130" y="106" font-size="7" fill="#22c55e" font-family="monospace">24°C</text>

    <circle cx="20" cy="122" r="4" fill="#ef4444" opacity="0.9" filter="url(#softGlow)"/>
    <text x="30" y="126" font-size="7" fill="#ccc" font-family="monospace">AC Unit</text>
    <text x="130" y="126" font-size="7" fill="#ef4444" font-family="monospace">OFF</text>

    <!-- Progress bars -->
    <rect x="8" y="134" width="154" height="2" rx="1" fill="#1a2040"/>
    <rect x="8" y="134" width="110" height="2" rx="1" fill="#7b2fff" opacity="0.6"/>
  </g>
  <!-- Panel 2 connection line -->
  <line x1="590" y1="150" x2="480" y2="300" stroke="#7b2fff" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.35"/>
  <circle cx="590" cy="150" r="3" fill="#7b2fff" opacity="0.7" filter="url(#softGlow)"/>

  <!-- Panel 3 - Security & Network (bottom right) -->
  <g transform="translate(590, 265)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="url(#panelGrad)" stroke="#00ffcc" stroke-width="1" opacity="0.9"/>
    <!-- Header -->
    <text x="12" y="20" font-size="7" fill="#00ffcc" font-family="monospace" font-weight="bold">🔒 SECURITY</text>
    <line x1="8" y1="25" x2="152" y2="25" stroke="#00ffcc" stroke-width="0.5" opacity="0.4"/>
    <!-- Security graph (semicircle gauge) -->
    <path d="M80,90 m-40,0 a40,40 0 0,1 80,0" fill="none" stroke="#1a2040" stroke-width="8"/>
    <path d="M80,90 m-40,0 a40,40 0 0,1 64,20" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)"/>
    <text x="67" y="95" font-size="14" fill="#00ffcc" font-family="monospace" font-weight="bold" filter="url(#softGlow)">98%</text>
    <text x="62" y="108" font-size="6" fill="#888" font-family="monospace">SECURITY SCORE</text>
    <!-- Bottom status -->
    <text x="12" y="38" font-size="6" fill="#22c55e" font-family="monospace">● Network: Secure</text>
    <text x="12" y="50" font-size="6" fill="#22c55e" font-family="monospace">● Firewall: Active</text>
    <text x="12" y="62" font-size="6" fill="#f59e0b" font-family="monospace">⚠ 2 Alerts Today</text>
  </g>
  <!-- Panel 3 connection line -->
  <line x1="590" y1="325" x2="480" y2="370" stroke="#00ffcc" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.35"/>
  <circle cx="590" cy="325" r="3" fill="#00ffcc" opacity="0.7" filter="url(#softGlow)"/>

  <!-- ===== IoT Connection dots floating ===== -->
  <!-- WiFi signals from house to panels -->
  <circle cx="310" cy="290" r="3" fill="#00d4ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="230" cy="250" r="2" fill="#00d4ff" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="400" cy="270" r="2" fill="#7b2fff" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="350" cy="180" r="2" fill="#00ffcc" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="270" cy="200" r="1.5" fill="#00d4ff" opacity="0.5"/>

  <!-- Floating data nodes -->
  <g filter="url(#softGlow)">
    <!-- Node 1 -->
    <circle cx="530" cy="200" r="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <circle cx="530" cy="200" r="3" fill="#00d4ff" opacity="0.8"/>
    <text x="540" y="197" font-size="6" fill="#00d4ff" font-family="monospace" opacity="0.7">WiFi</text>

    <!-- Node 2 -->
    <circle cx="555" cy="230" r="6" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.5"/>
    <circle cx="555" cy="230" r="2.5" fill="#00ffcc" opacity="0.7"/>
    <text x="563" y="233" font-size="6" fill="#00ffcc" font-family="monospace" opacity="0.7">BLE</text>

    <!-- Node 3 -->
    <circle cx="545" cy="255" r="5" fill="none" stroke="#7b2fff" stroke-width="1" opacity="0.5"/>
    <circle cx="545" cy="255" r="2" fill="#7b2fff" opacity="0.7"/>
    <text x="552" y="258" font-size="6" fill="#7b2fff" font-family="monospace" opacity="0.7">Zigbee</text>
  </g>

  <!-- Connection lines between nodes -->
  <line x1="530" y1="200" x2="555" y2="230" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.4"/>
  <line x1="555" y1="230" x2="545" y2="255" stroke="#00ffcc" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.4"/>
  <line x1="530" y1="200" x2="500" y2="300" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.3"/>

  <!-- ===== Bottom Status Bar ===== -->
  <rect x="140" y="440" width="520" height="45" rx="10" fill="rgba(10,20,50,0.85)" stroke="#1e3a7a" stroke-width="1"/>
  <!-- Stats -->
  <text x="168" y="458" font-size="6" fill="#888" font-family="monospace">DEVICES</text>
  <text x="162" y="472" font-size="11" fill="#00d4ff" font-family="monospace" font-weight="bold" filter="url(#softGlow)">12</text>

  <line x1="220" y1="447" x2="220" y2="478" stroke="#1e3a7a" stroke-width="1"/>

  <text x="235" y="458" font-size="6" fill="#888" font-family="monospace">UPTIME</text>
  <text x="228" y="472" font-size="11" fill="#00ffcc" font-family="monospace" font-weight="bold" filter="url(#softGlow)">99.8%</text>

  <line x1="295" y1="447" x2="295" y2="478" stroke="#1e3a7a" stroke-width="1"/>

  <text x="310" y="458" font-size="6" fill="#888" font-family="monospace">ENERGY SAVED</text>
  <text x="310" y="472" font-size="11" fill="#7b2fff" font-family="monospace" font-weight="bold" filter="url(#softGlow)">34%</text>

  <line x1="380" y1="447" x2="380" y2="478" stroke="#1e3a7a" stroke-width="1"/>

  <text x="395" y="458" font-size="6" fill="#888" font-family="monospace">SECURITY</text>
  <text x="393" y="472" font-size="11" fill="#22c55e" font-family="monospace" font-weight="bold" filter="url(#softGlow)">ARMED</text>

  <line x1="460" y1="447" x2="460" y2="478" stroke="#1e3a7a" stroke-width="1"/>

  <text x="475" y="458" font-size="6" fill="#888" font-family="monospace">NETWORK</text>
  <text x="470" y="472" font-size="11" fill="#00d4ff" font-family="monospace" font-weight="bold" filter="url(#softGlow)">1.2 Gb/s</text>

  <line x1="545" y1="447" x2="545" y2="478" stroke="#1e3a7a" stroke-width="1"/>

  <text x="560" y="458" font-size="6" fill="#888" font-family="monospace">ALERTS</text>
  <text x="562" y="472" font-size="11" fill="#f59e0b" font-family="monospace" font-weight="bold" filter="url(#softGlow)">2</text>

  <!-- Pulsing circle on house center -->
  <circle cx="310" cy="290" r="15" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="310" cy="290" r="25" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Title watermark -->
  <text x="310" y="488" font-size="8" fill="#334" font-family="monospace" text-anchor="middle" opacity="0.5">3D Smart Home + IoT Dashboard · Three.js / WebGL</text>
</svg>
